repos:
  - repo: local
    hooks:
      - id: spotless
        name: spotlessApply
        entry: python -c "import os, subprocess, sys; sys.exit(subprocess.call([os.path.abspath('gradlew.bat' if os.name == 'nt' else 'gradlew'), '--quiet', '--offline', 'spotlessApply']))"
        language: python
        files: \.java$
        pass_filenames: false
